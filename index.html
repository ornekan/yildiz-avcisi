<style>
*{box-sizing:border-box}
html,body{margin:0;background:#11131a;color:#f2f2f2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 16px)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 8px}
h1{margin:0;font-size:22px;font-weight:900;background:linear-gradient(90deg,#ffd84d,#ff9a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12px;opacity:.6}
.sync{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:#2a2e3d;white-space:nowrap}.sync.ok{background:#1e4d36;color:#8ff0b8}
#scene{border-radius:14px;overflow:hidden;box-shadow:0 8px 30px #0008;background:#000;touch-action:manipulation}
#room{display:block;width:100%;height:auto;aspect-ratio:16/10;cursor:pointer}
#mePick{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
#mePick .lbl{font-size:13px;font-weight:700;opacity:.8}
#meBtns{display:flex;gap:6px;flex-wrap:wrap}
#meBtns button{border:2px solid var(--c);background:transparent;color:#fff;border-radius:99px;padding:7px 13px;font-weight:800;font-size:14px}
#meBtns button.on{background:var(--c)}
#meHint{width:100%;font-size:12px;opacity:.6}
#mePick.flash{animation:fl .9s 2}
@keyframes fl{50%{background:#ffd84d33;border-radius:12px}}
.passbar{display:flex;gap:10px;align-items:center;margin:12px 0}
#pass{flex:1;font-size:18px;font-weight:800;padding:15px;border:none;border-radius:14px;background:linear-gradient(90deg,#ff9a3d,#ff6a3d);color:#fff;box-shadow:0 4px 14px #ff6a3d55}
#pass:active,.btns button:active,#meBtns button:active{transform:scale(.96)}
.cinfo{font-size:12px;opacity:.8;text-align:right;line-height:1.5;min-width:92px}
.cinfo b{color:#ffd84d}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.grid{grid-template-columns:1.1fr 1fr}}
.box{background:#1b1e29;border-radius:14px;padding:12px}
.box h2{margin:0 0 8px;font-size:15px;opacity:.85}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:11px;opacity:.55;font-weight:600;padding:4px 2px;text-align:center}
td{padding:9px 2px;text-align:center;border-top:1px solid #ffffff12}
td.nm{text-align:left;font-weight:700}
td.pt{font-weight:900;color:#ffd84d;font-size:17px}
.fire{font-size:12px;color:#ff9a3d}
tbody tr:first-child td{background:#ffd84d10}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#232737;border-radius:12px;padding:10px;border-top:3px solid var(--c)}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ch b{font-size:16px} .ch span{font-weight:800;color:#ffd84d}
.btns{display:grid;gap:6px}
.btns button{display:flex;justify-content:space-between;align-items:center;border:none;border-radius:9px;padding:10px;font-size:14px;font-weight:700;color:#fff}
.btns small{font-size:13px;font-weight:900}
.win{background:#2e9e5b}.draw{background:#3c6fd1}.loss{background:#4a4f63}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1;padding:11px;border-radius:10px;border:1px solid #ffffff22;background:transparent;color:#ddd;font-weight:700;font-size:14px}
.tools button:disabled{opacity:.35}
.tips{font-size:12px;opacity:.55;margin:10px 4px 0;line-height:1.5}
#confirm{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
#confirm .dlg{background:#1b1e29;border-radius:16px;padding:20px;max-width:320px;text-align:center}
#confirm .row{display:flex;gap:10px;margin-top:16px}
#confirm button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:800;font-size:15px}
#yes{background:#c0392b;color:#fff}#no{background:#3a3f52;color:#fff}
.hidden{display:none!important}
</style>
</head>

function fresh(){return {stats:Object.fromEntries(P.map(p=>[p.id,{g:0,b:0,m:0}])),hist:[],cig:2,tur:0,last:null,pos:Object.fromEntries(P.map(p=>[p.id,{x:p.home[0],y:p.home[1]}]))}}
function norm(s){
  const f=fresh();s=s||{};
  const out={stats:{},hist:Array.isArray(s.hist)?s.hist:(s.hist?Object.values(s.hist):[]),cig:Number.isInteger(s.cig)?s.cig:f.cig,tur:s.tur||0,last:s.last||null,pos:{}};
  P.forEach(p=>{const x=(s.stats||{})[p.id]||{};out.stats[p.id]={g:x.g||0,b:x.b||0,m:x.m||0};
    const q=(s.pos||{})[p.id];out.pos[p.id]=(q&&isFinite(q.x)&&isFinite(q.y))?{x:+q.x,y:+q.y}:f.pos[p.id]});
  return out;
}
function loadLocal(){try{return norm(JSON.parse(localStorage.getItem(KEY)))}catch(e){return fresh()}}

let ref=null;
function setStatus(t,ok){const e=$('sync');e.textContent=t;e.className='sync '+(ok?'ok':'off')}
function change(fn){
  if(ref){ref.transaction(cur=>{const s=norm(cur);fn(s);return s},err=>{if(err)setStatus('⚠️ Kaydedilemedi',false)})}
  else{const prev=st;const s=norm(JSON.parse(JSON.stringify(st)));fn(s);apply(s,prev);try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
}
function apply(s,prev){
  st=s;
  P.forEach(p=>{const a=A[p.id],q=s.pos[p.id];
    if(!prev){a.x=a.tx=q.x;a.y=a.ty=q.y}
    else{const o=prev.pos[p.id];if(o.x!==q.x||o.y!==q.y){a.tx=q.x;a.ty=q.y}}});
  if(prev&&prev.cig!==s.cig)startPass(prev.cig,s.cig);
  if(s.last&&prev&&(!prev.last||prev.last.t!==s.last.t))showEvent(s.last);
  render();
}
let seenFirst=false;
function startSync(){
  if(!FIREBASE_CONFIG||!window.firebase){setStatus('📱 Sadece bu telefon',false);return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const db=firebase.database();ref=db.ref('odaLigi');
    setStatus('⏳ Bağlanıyor…',false);
    db.ref('.info/connected').on('value',v=>setStatus(v.val()?'🟢 Ortak tablo':'🔴 Bağlantı yok',!!v.val()));
    ref.on('value',snap=>{const s=norm(snap.val());apply(s,seenFirst?st:null);seenFirst=true;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}});
  }catch(e){ref=null;setStatus('📱 Sadece bu telefon',false)}
}

  const t=el('text',{x:0,y:-17,'text-anchor':'middle','font-family':'Arial','font-size':22,'font-weight':700,fill:'#222'},g);t.textContent=text;
  let w=text.length*11.5;try{w=t.getComputedTextLength()}catch(e){}
  r.setAttribute('x',-w/2-14);r.setAttribute('width',w+28);
  a.bubble={g,w:w+28,end:performance.now()+dur};
}
function setMood(id,m,dur){const a=A[id];a.mood=m;a.moodStart=performance.now();a.moodEnd=a.moodStart+dur;
  if(m==='loss'&&!a.cloud){const c=el('g',{},fx);
    el('ellipse',{cx:0,cy:0,rx:42,ry:20,fill:'#6b7280'},c);el('circle',{cx:-22,cy:-8,r:18,fill:'#6b7280'},c);el('circle',{cx:14,cy:-14,r:22,fill:'#6b7280'},c);
    c.drops=[0,1,2,3].map(i=>el('line',{x1:-24+i*16,y1:20,x2:-28+i*16,y2:32,stroke:'#7fb2ff','stroke-width':4,'stroke-linecap':'round'},c));
    a.cloud=c}}

// ---- sigara ----
const cig=$('cig'), smokeG=$('smokeG');
let pass=null, cigPos=[0,0,1];
function startPass(from,to){pass={from,to,t0:performance.now()};beep(400,.06,'triangle')}
function spawnSmoke(big){const [x,y,s]=cigPos;const sx=x+26*s,sy=y+6*s;
  const c=el('circle',{cx:sx,cy:sy,r:(big?8:5)*s,fill:'url(#smoke)'},smokeG);let k=0;const dx=(Math.random()-.3)*.8;
  (function a(){k++;c.setAttribute('cy',sy-k*1.1);c.setAttribute('cx',sx+k*dx+Math.sin(k/9)*4);c.setAttribute('r',((big?8:5)+k*.28)*s);c.setAttribute('opacity',Math.max(0,1-k/80));if(k<80)requestAnimationFrame(a);else c.remove()})()}
setInterval(()=>{if(!pass)spawnSmoke(false)},420);

// ---- dart ----
const dartsG=$('darts');const darts=[];
function throwDart(){
  const ang=Math.random()*Math.PI*2, d=Math.abs((Math.random()+Math.random()+Math.random()-1.5))*70;
  const x=160+Math.cos(ang)*d, y=230+Math.sin(ang)*d;
  const sc=d<8?50:d<22?40:d<38?30:d<55?20:d<72?10:d<90?5:0;
  const g=el('g',{},dartsG);
  el('line',{x1:0,y1:0,x2:22,y2:-14,stroke:'#ccc','stroke-width':3},g);
  el('path',{d:'M18,-12 L30,-24 L26,-10 Z M18,-12 L32,-14 L24,-6 Z',fill:'#c0392b'},g);
  let k=0;(function a(){k++;const s=1+Math.max(0,(10-k))*0.25;g.setAttribute('transform',`translate(${x},${y}) scale(${s})`);if(k<10)requestAnimationFrame(a)})();
  darts.push(g);if(darts.length>6)darts.shift().remove();
  setTimeout(()=>{beep(sc>=40?880:sc?520:160,.08,'square',.06);popup(x,y-20,sc?('+'+sc):'Iska!',sc>=40?'#ffd84d':'#fff',32)},170);
}

// ================= OLAYLAR =================
function showEvent(ev){
  if(ev.k==='res'){
    const [hx,hy,s]=headOf(ev.p);
    popup(hx,hy-10*s,ev.r==='g'?'+3':ev.r==='b'?'+1':'0',ev.r==='g'?'#ffd84d':ev.r==='b'?'#9ad0ff':'#ff8a8a');
    if(ev.r==='g'){setMood(ev.p,'win',2600);confetti(hx,hy);fanfare();setTimeout(()=>say(ev.p,rnd(P.find(p=>p.id===ev.p).win)),300);
      const n=streak(ev.p);if(n>=2)setTimeout(()=>popup(hx,hy-70*s,'🔥 '+n+' seri!','#ff9a3d',40),700)}
    else if(ev.r==='b'){setMood(ev.p,'draw',1200);beep(520,.12);say(ev.p,rnd(DRAW_LINES))}
    else{setMood(ev.p,'loss',3600);beep(220,.25,'sawtooth',.07);setTimeout(()=>beep(160,.35,'sawtooth',.07),220);say(ev.p,rnd(P.find(p=>p.id===ev.p).loss))}
  }else if(ev.k==='undo'){beep(300,.08)}
  else if(ev.k==='say'){const p=P.find(x=>x.id===ev.p);if(p)say(p.id,p.lines[ev.i%p.lines.length])}
}

// ================= DOKUNMA =================
function svgPt(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
const marker=el('g',{opacity:0},$('marks'));el('ellipse',{cx:0,cy:0,rx:40,ry:9,fill:'none',stroke:'#fff','stroke-width':4},marker);
let markT=0;
svg.addEventListener('pointerdown',e=>{
  const pt=svgPt(e);
  // dart tahtası
  if(pt.x>50&&pt.x<270&&pt.y>110&&pt.y<385){throwDart();return}
  // kedi
  if(Math.hypot(pt.x-(cat.x+10),pt.y-(cat.y-30))<60){popup(cat.x,cat.y-80,'Miyav!','#fff',30);beep(900,.12,'triangle');setTimeout(()=>beep(700,.18,'triangle'),110);cat.next=0;return}
  // karakter (öndekinden başla)
  const order=P.map(p=>A[p.id]).sort((a,b)=>b.y-a.y);
  for(const a of order){const s=scaleAt(a.y);if(Math.abs(pt.x-a.x)<70*s&&pt.y<a.y+5&&pt.y>a.y-320*s){
    const i=Math.floor(Math.random()*a.p.lines.length);change(st2=>{st2.last={k:'say',p:a.p.id,i,t:Date.now()+Math.random()}});return}}
  // zemine yürü
  if(pt.y>760){
    if(!me){hintPick();return}
    const [x,y]=clampFloor(pt.x,pt.y);
    A[me].tx=x;A[me].ty=y;markT=40;marker.setAttribute('transform',`translate(${x},${y}) scale(${scaleAt(y)})`);
    change(s2=>{s2.pos[me]={x:Math.round(x),y:Math.round(y)}});
  }
});
function hintPick(){const r=$('mePick');r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')}

// ================= KİM OLDUĞUNU SEÇ =================
function renderMe(){

}
$('meBtns').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;me=b.dataset.me;try{localStorage.setItem(MEKEY,me)}catch(x){}renderMe();say(me,'Benim!',1400)});

// ================= TABLO =================
let leader=null;
function render(){
  const order=[...P].sort((a,b)=>{const X=st.stats[a.id],Y=st.stats[b.id];return pts(Y)-pts(X)||Y.g-X.g||a.ad.localeCompare(b.ad)});
  $('tbody').innerHTML=order.map((p,i)=>{const s=st.stats[p.id],o=s.g+s.b+s.m,n=streak(p.id);
    return `<tr><td>${i+1}</td><td class="nm"><span class="dot" style="background:${p.color}"></span>${p.ad}${n>=2?` <span class="fire">🔥${n}</span>`:''}</td><td>${o}</td><td>${s.g}</td><td>${s.b}</td><td>${s.m}</td><td class="pt">${pts(s)}</td></tr>`}).join('');
  if(!$('cards').children.length)$('cards').innerHTML=P.map(p=>`
    <div class="card" style="--c:${p.color}">
      <div class="ch"><b>${p.ad}</b><span id="pt-${p.id}"></span></div>

        <button data-p="${p.id}" data-r="g" class="win">Galibiyet<small>+3</small></button>
        <button data-p="${p.id}" data-r="b" class="draw">Beraberlik<small>+1</small></button>
        <button data-p="${p.id}" data-r="m" class="loss">Yenilgi<small>0</small></button>
      </div></div>`).join('');
  P.forEach(p=>$('pt-'+p.id).textContent=pts(st.stats[p.id])+' P');
  $('tur').textContent=st.tur;$('holder').textContent=P[st.cig].ad;$('undo').disabled=!st.hist.length;
  const ls=st.stats[order[0].id];

}
$('cards').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=b.dataset.p,r=b.dataset.r;
  change(s=>{s.stats[p][r]++;s.hist.push({p,r});s.last={k:'res',p,r,t:Date.now()+Math.random()}})});
$('undo').onclick=()=>change(s=>{const h=s.hist.pop();if(h){s.stats[h.p][h.r]=Math.max(0,s.stats[h.p][h.r]-1);s.last={k:'undo',t:Date.now()+Math.random()}}});
$('reset').onclick=()=>$('confirm').classList.remove('hidden');
$('no').onclick=()=>$('confirm').classList.add('hidden');
$('yes').onclick=()=>{change(s=>{const c=s.cig,f=fresh();s.stats=f.stats;s.hist=[];s.tur=0;s.cig=c;s.last={k:'reset',t:Date.now()+Math.random()}});$('confirm').classList.add('hidden')};
$('pass').onclick=()=>{if(pass)return;change(s=>{s.cig=(s.cig+1)%P.length;if(s.cig===0)s.tur++;s.last={k:'pass',t:Date.now()+Math.random()}})};

// ================= ANA DÖNGÜ =================
const crown=$('crown');
let lastOrder='';
function frame(now){
  // aktörler
  P.forEach(p=>{const a=A[p.id];
    const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy),moving=d>1.5;
    if(moving){const sp=4.5;a.x+=dx/d*Math.min(sp,d);a.y+=dy/d*Math.min(sp,d);a.walk+=.33}
    let off=0,rot=0,sy=1;
    if(moving){off=-Math.abs(Math.sin(a.walk))*12;rot=Math.sin(a.walk)*4}
    else sy=1+Math.sin(now/650+a.ph)*.012;
    if(a.mood&&now<a.moodEnd){const t=(now-a.moodStart)/1000;
      if(a.mood==='win'){off=-Math.abs(Math.sin(t*7))*48;rot=Math.sin(t*14)*7}
      else if(a.mood==='draw'){off=-Math.abs(Math.sin(t*6))*20}
      else if(a.mood==='loss'){rot=-7;off=5;sy=.96}}
    else if(a.mood){a.mood=null}
    a.off=off;
    const s=scaleAt(a.y);
    a.g.setAttribute('transform',`translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) scale(${s.toFixed(3)})`);
    a.body.setAttribute('transform',`translate(0,${off.toFixed(1)}) rotate(${rot.toFixed(2)}) scale(1,${sy.toFixed(3)})`);
    // balon
    if(a.bubble){if(now>a.bubble.end){a.bubble.g.remove();a.bubble=null}
      else{const [hx,hy]=headOf(p.id);let bx=Math.max(a.bubble.w/2+6,Math.min(1594-a.bubble.w/2,hx));a.bubble.g.setAttribute('transform',`translate(${bx.toFixed(1)},${(hy-14).toFixed(1)})`)}}
    // bulut
    if(a.cloud){if(a.mood!=='loss'){a.cloud.remove();a.cloud=null}
      else{const [hx,hy,s2]=headOf(p.id);a.cloud.setAttribute('transform',`translate(${hx},${hy-50*s2}) scale(${s2})`);
        a.cloud.drops.forEach((l,i)=>{const k=((now/6+i*13)%30);l.setAttribute('transform',`translate(0,${k})`);l.setAttribute('opacity',1-k/30)})}}
  });
  // kedi
  {const dx=cat.tx-cat.x,dy=cat.ty-cat.y,d=Math.hypot(dx,dy);
    if(d>1.5){const sp=1.8;cat.x+=dx/d*Math.min(sp,d);cat.y+=dy/d*Math.min(sp,d);cat.walk+=.3;if(Math.abs(dx)>2)cat.dir=dx>0?1:-1}
    else if(now>cat.next){const [x,y]=clampFloor(80+Math.random()*1300,FY0+Math.random()*(FY1-FY0));cat.tx=x;cat.ty=y;cat.next=now+3000+Math.random()*6000}
    const s=scaleAt(cat.y)*.9,bob=d>1.5?-Math.abs(Math.sin(cat.walk))*4:0;
    cat.g.setAttribute('transform',`translate(${cat.x.toFixed(1)},${cat.y.toFixed(1)}) scale(${(s*cat.dir).toFixed(3)},${s.toFixed(3)})`);
    cat.b.setAttribute('transform',`translate(0,${bob.toFixed(1)})`);
    cat.tail.setAttribute('transform',`rotate(${(Math.sin(now/300)*12).toFixed(1)} -30 -22)`)}
  // derinlik sırası
  const items=[...P.map(p=>A[p.id]),cat].sort((a,b)=>a.y-b.y);
  const key=items.map(i=>i.p?i.p.id:'cat').join();
  if(key!==lastOrder){items.forEach(i=>actorsG.appendChild(i.g));lastOrder=key}
  // sigara
  if(pass){const t=Math.min(1,(now-pass.t0)/700),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const [x0,y0,s0]=mouthOf(P[pass.from].id),[x1,y1,s1]=mouthOf(P[pass.to].id);
    cigPos=[x0+(x1-x0)*e,y0+(y1-y0)*e-Math.sin(Math.PI*e)*Math.min(260,60+Math.abs(x1-x0)*.35),s0+(s1-s0)*e];
    if(t>=1){const to=P[pass.to].id;pass=null;beep(700,.06,'triangle');for(let i=0;i<3;i++)setTimeout(()=>spawnSmoke(true),i*120);say(to,rnd(THANKS),1800)}}
  else cigPos=mouthOf(P[st.cig].id);
  cig.setAttribute('transform',`translate(${cigPos[0].toFixed(1)},${cigPos[1].toFixed(1)}) scale(${cigPos[2].toFixed(3)})`);
  // taç
  if(leader){const [hx,hy,s]=posOf(leader,-337);crown.style.display='';crown.setAttribute('transform',`translate(${(hx-22*s).toFixed(1)},${hy.toFixed(1)}) scale(${s.toFixed(3)})`)}
  else crown.style.display='none';
  // konfeti
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.35;q.vx*=.98;q.rot+=q.vr;q.life--;
    q.e.setAttribute('transform',`translate(${q.x.toFixed(1)},${q.y.toFixed(1)}) rotate(${q.rot.toFixed(0)})`);q.e.setAttribute('opacity',Math.min(1,q.life/30));
    if(q.life<=0){q.e.remove();parts.splice(i,1)}}
  // hedef işareti
  if(markT>0){markT--;marker.setAttribute('opacity',markT/40)}
  requestAnimationFrame(frame);
}

// boşta laf atma (sadece bu telefonda)
setInterval(()=>{if(document.hidden)return;if(Math.random()<.5){const p=rnd(P);if(!A[p.id].bubble)say(p.id,rnd(p.lines),2600)}},9000);

// ---------- TV'de maç videosu ----------
const tv=$('tvg'), TX=404, TY=360, TW=372, TH=218;
(function buildPitch(){
  for(let i=0;i<8;i++)el('rect',{x:TX+i*TW/8,y:TY,width:TW/8,height:TH,fill:i%2?'#2e8b3a':'#34973f'},tv);
  const L={fill:'none',stroke:'#e8f5e8','stroke-width':2,opacity:.9};
  el('rect',{x:TX+10,y:TY+24,width:TW-20,height:TH-34,...L},tv);
  el('line',{x1:TX+TW/2,y1:TY+24,x2:TX+TW/2,y2:TY+TH-10,...L},tv);
  el('circle',{cx:TX+TW/2,cy:TY+24+(TH-34)/2,r:26,...L},tv);
  el('rect',{x:TX+10,y:TY+70,width:44,height:TH-124,...L},tv);
  el('rect',{x:TX+TW-54,y:TY+70,width:44,height:TH-124,...L},tv);
  el('rect',{x:TX+4,y:TY+100,width:6,height:TH-184,fill:'#fff'},tv);
  el('rect',{x:TX+TW-10,y:TY+100,width:6,height:TH-184,fill:'#fff'},tv);
})();
const topBar=el('rect',{x:TX,y:TY,width:TW,height:20,fill:'#000',opacity:.6},tv);
const sb=el('text',{x:TX+8,y:TY+15,'font-size':13,'font-family':'Arial','font-weight':700,fill:'#fff'},tv);
const banner=el('text',{x:TX+TW/2,y:TY+TH/2+12,'text-anchor':'middle','font-size':40,'font-family':'Arial','font-weight':900,fill:'#ffd84d',stroke:'#000','stroke-width':3,'paint-order':'stroke',opacity:0},tv);
banner.textContent='GOOOL!';
const F={x0:TX+16,x1:TX+TW-16,y0:TY+30,y1:TY+TH-14};
const players=[];
for(let t=0;t<2;t++)for(let i=0;i<5;i++){
  const home=t===0;const bx=home?TX+60+ (i%3)*70:TX+TW-60-(i%3)*70;
  const p={t,x:bx,y:F.y0+20+i*(F.y1-F.y0-40)/4,bx,by:F.y0+20+i*(F.y1-F.y0-40)/4,tx:0,ty:0};
  p.c=el('circle',{cx:p.x,cy:p.y,r:6,fill:home?'#e74c3c':'#f1c40f',stroke:'#222','stroke-width':1.2},tv);
  players.push(p);
}
const ball={x:TX+TW/2,y:TY+24+(TH-34)/2,vx:0,vy:0,owner:null};
const ballC=el('circle',{cx:ball.x,cy:ball.y,r:3.5,fill:'#fff',stroke:'#333','stroke-width':1},tv);
let score=[0,0],clock=0,celebrate=0;
function kickoff(){ball.x=TX+TW/2;ball.y=TY+24+(TH-34)/2;ball.vx=ball.vy=0;ball.owner=null;players.forEach(p=>{p.x=p.bx;p.y=p.by})}
function tvStep(){
  clock+=0.035; if(clock>=90){clock=0;score=[0,0];kickoff()}
  sb.textContent=`EV ${score[0]} - ${score[1]} DEP   ${Math.floor(clock)}'`;
  if(celebrate>0){celebrate--;banner.setAttribute('opacity',Math.min(1,celebrate/20));if(celebrate===0)kickoff();return}
  // top sahibi
  if(ball.owner){
    const o=ball.owner;const goalX=o.t===0?F.x1:F.x0;
    o.tx=goalX;o.ty=TY+TH/2+Math.sin(clock*3)*20;
    ball.x=o.x+(o.t===0?7:-7);ball.y=o.y;
    if(Math.random()<.025||Math.abs(o.x-goalX)<60){
      // pas veya şut
      const mates=players.filter(p=>p.t===o.t&&p!==o);
      let tx,ty;
      if(Math.abs(o.x-goalX)<90&&Math.random()<.6){tx=goalX+(o.t===0?10:-10);ty=TY+TH/2+(Math.random()-.5)*60}
      else{const m=mates[Math.floor(Math.random()*mates.length)];tx=m.x;ty=m.y}
      const d=Math.hypot(tx-ball.x,ty-ball.y)||1;ball.vx=(tx-ball.x)/d*4.2;ball.vy=(ty-ball.y)/d*4.2;ball.owner=null;ball.cool=12;
    }
  }else{
    ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.985;ball.vy*=.985;
    if(ball.cool)ball.cool--;
    // gol?
    const gy=Math.abs(ball.y-(TY+TH/2))<34;
    if(ball.x<F.x0-4&&gy){score[1]++;goal();return}
    if(ball.x>F.x1+4&&gy){score[0]++;goal();return}
    if(ball.y<F.y0||ball.y>F.y1){ball.vy*=-1;ball.y=Math.max(F.y0,Math.min(F.y1,ball.y))}
    if(ball.x<F.x0||ball.x>F.x1){ball.vx*=-1;ball.x=Math.max(F.x0,Math.min(F.x1,ball.x))}
    if(!ball.cool)for(const p of players){if(Math.hypot(p.x-ball.x,p.y-ball.y)<8){ball.owner=p;break}}
  }
  // oyuncu hareketi
  let near=[null,null],nd=[1e9,1e9];
  players.forEach(p=>{const d=Math.hypot(p.x-ball.x,p.y-ball.y);if(d<nd[p.t]){nd[p.t]=d;near[p.t]=p}});
  players.forEach(p=>{
    let tx,ty;
    if(ball.owner===p){tx=p.tx;ty=p.ty}
    else if(near[p.t]===p){tx=ball.x;ty=ball.y}
    else{tx=p.bx+(ball.x-(TX+TW/2))*.45;ty=p.by+(ball.y-p.by)*.25}
    const d=Math.hypot(tx-p.x,ty-p.y)||1,sp=ball.owner===p?1.15:1.3;
    if(d>1){p.x+=(tx-p.x)/d*Math.min(sp,d);p.y+=(ty-p.y)/d*Math.min(sp,d)}
    p.x=Math.max(F.x0,Math.min(F.x1,p.x));p.y=Math.max(F.y0,Math.min(F.y1,p.y));
    p.c.setAttribute('cx',p.x.toFixed(1));p.c.setAttribute('cy',p.y.toFixed(1));
  });
  ballC.setAttribute('cx',ball.x.toFixed(1));ballC.setAttribute('cy',ball.y.toFixed(1));
}
function goal(){celebrate=80;banner.setAttribute('opacity',1);ballC.setAttribute('cx',ball.x);ballC.setAttribute('cy',ball.y)}
(function loop(){tvStep();requestAnimationFrame(loop)})();


apply(st,null);renderMe();requestAnimationFrame(frame);startSync();
if('serviceWorker' in navigator && location.protocol==='https:' && !/claude|anthropic/.test(location.host)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
